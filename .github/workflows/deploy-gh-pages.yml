name: deploy-gh-pages (L2)

on:
  push:
    branches: [main]
    paths:
      - 'FE/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Guard: Figma tidak boleh ikut artefak
      - run: |
          if [ -d dist/Figma ] || find dist -iname '*figma*' | grep -q .; then
            echo "BLOCKED: artefak mengandung Figma" >&2; exit 1;
          fi
          ls -R dist | head -30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FE/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
